name: Fire TV launcher APK

on:
  push:
    branches: [fire-tv-home]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and release build
        working-directory: launcher
        env:
          KEYSTORE_B64: ${{ secrets.TVHOME_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.TVHOME_KEYSTORE_PASS }}
        run: |
          chmod +x gradlew
          # One key for every build, so a new APK installs over the last one (pm install -r).
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tvhome.p12"
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/tvhome.p12" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASS" \
            -Pandroid.injected.signing.key.alias=tvhome \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASS"
      - uses: actions/upload-artifact@v4
        with:
          name: tvhome-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
